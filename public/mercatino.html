<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Mercatino · gift card di Natale</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
    <link rel="stylesheet" href="/css/natale-avvento.css?v=2026-10-16ab">
    <link rel="stylesheet" href="/css/mercatino.css?v=2026-10-16af">
</head>
<body>
    <main class="wrap merc">
        <header class="merc-head">
            <h1>Mercatino · gift card di Natale</h1>
            <p class="merc-lead">Vendita in contanti. Solo per i volontari: serve il PIN.</p>
        </header>

        <section id="merc-gate" class="merc-card" aria-labelledby="gate-title">
            <h2 id="gate-title">Entra con il PIN</h2>
            <form id="gate-form" class="merc-form" novalidate>
                <label for="pin-input">PIN dei volontari</label>
                <input type="password" id="pin-input" inputmode="numeric" autocomplete="off" required>
                <p id="gate-error" class="merc-error" hidden></p>
                <button type="submit" class="merc-btn">Entra</button>
            </form>
        </section>

        <div id="merc-app" class="merc-app" hidden>
            <section class="merc-card merc-pick" aria-labelledby="design-title">
                <h2 id="design-title">1. Scegli il disegno <span class="merc-selected">· scelto: <strong id="merc-selected">nessuno</strong></span></h2>
                <div class="merc-designs" id="merc-designs" role="radiogroup" aria-label="Disegni davanti"></div>
                <p class="merc-strip-title">Disegni sul retro: scorri con le frecce</p>
                <div class="merc-strip-wrap">
                    <button type="button" class="merc-arrow" id="strip-prev" aria-label="Disegni precedenti">‹</button>
                    <div class="merc-strip" id="merc-strip" role="radiogroup" aria-label="Disegni sul retro"></div>
                    <button type="button" class="merc-arrow" id="strip-next" aria-label="Disegni successivi">›</button>
                </div>
            </section>

            <div class="merc-side">
            <section class="merc-card merc-data" aria-labelledby="data-title">
                <h2 id="data-title">2. Dati</h2>
                <form id="sale-form" class="merc-form" novalidate>
                    <div class="merc-field">
                        <label for="donor-name">Nome di chi regala</label>
                        <input type="text" id="donor-name" maxlength="100" required placeholder="es. Mario Rossi">
                    </div>
                    <div class="merc-field">
                        <label for="donor-email">Email di chi regala (facoltativa)</label>
                        <input type="email" id="donor-email" maxlength="255" placeholder="es. mario@email.com">
                    </div>
                    <div class="merc-field">
                        <label for="recipient-name">Nome di chi riceve</label>
                        <input type="text" id="recipient-name" maxlength="100" required placeholder="es. Anna Bianchi">
                    </div>
                    <div class="merc-field">
                        <label for="recipient-email">Email di chi riceve</label>
                        <input type="email" id="recipient-email" maxlength="255" required placeholder="es. anna@email.com">
                    </div>
                    <div class="merc-field merc-field-wide">
                        <label for="message">Messaggio di auguri (facoltativo)</label>
                        <textarea id="message" maxlength="490" rows="2" placeholder="Buon Natale!"></textarea>
                    </div>
                    <div class="merc-actions">
                        <p id="sale-error" class="merc-error" hidden></p>
                        <p id="sale-ok" class="merc-ok" hidden></p>
                        <button type="submit" class="merc-btn merc-btn-big" id="sale-submit">Registra vendita in contanti · 20 €</button>
                        <p class="merc-note">Consegna per email il 25 dicembre alle 00:00.</p>
                    </div>
                </form>
            </section>

            <section class="merc-card merc-summary" aria-labelledby="sum-title">
                <h2 id="sum-title">Riepilogo di oggi</h2>
                <p class="merc-total" id="sum-total">Caricamento…</p>
                <ul class="merc-list" id="sum-list"></ul>
                <button type="button" class="merc-btn merc-btn-small" id="sum-refresh">Aggiorna</button>
            </section>
            </div>
        </div>
    </main>
    <div class="zoom" id="zoom" hidden>
        <div class="zoom-box" role="dialog" aria-modal="true" aria-labelledby="zoom-label">
            <button type="button" class="modal-close" id="zoom-close" aria-label="Chiudi">×</button>
            <div class="zoom-frame">
                <img id="zoom-img" alt="">
                <button type="button" class="zoom-choose" id="zoom-choose">Scelgo questo disegno</button>
            </div>
            <p class="zoom-label" id="zoom-label"></p>
        </div>
    </div>
    <script src="/js/mercatino.js?v=2026-10-16af"></script>
</body>
</html>
