<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grazie per gli Auguri!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(180deg, #87CEEB 0%, #5BB8E8 40%, #1a8fcc 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka One', 'Arial Rounded MT Bold', sans-serif;
      overflow: hidden;
    }

    .card {
      width: 900px;
      height: 600px;
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    /* SKY */
    .sky {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 55%;
      background: linear-gradient(180deg, #87CEEB 0%, #B0E0FF 100%);
    }

    /* SUN */
    .sun {
      position: absolute;
      top: 30px; right: 80px;
      width: 70px; height: 70px;
      background: radial-gradient(circle, #FFE566 60%, #FFD700 100%);
      border-radius: 50%;
      box-shadow: 0 0 30px 10px rgba(255,230,80,0.5);
      animation: pulse-sun 3s infinite ease-in-out;
    }
    @keyframes pulse-sun {
      0%,100% { box-shadow: 0 0 30px 10px rgba(255,230,80,0.5); }
      50% { box-shadow: 0 0 50px 20px rgba(255,230,80,0.7); }
    }

    /* SEA */
    .sea {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 52%;
    }
    .wave1 {
      position: absolute;
      top: 0; left: -20px; right: -20px;
      height: 60px;
      background: #2196B8;
      border-radius: 50% 50% 0 0 / 40px 40px 0 0;
      animation: wave 2.5s infinite ease-in-out;
    }
    .wave2 {
      position: absolute;
      top: 20px; left: -30px; right: -30px;
      height: 100%;
      background: linear-gradient(180deg, #1a8fcc 0%, #0d6fa0 50%, #0a5880 100%);
    }
    @keyframes wave {
      0%,100% { transform: translateX(0) scaleY(1); }
      50% { transform: translateX(10px) scaleY(1.1); }
    }

    /* Splash waves */
    .splash {
      position: absolute;
      bottom: 210px; left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      animation: splash-anim 1.5s infinite ease-in-out;
      z-index: 10;
    }
    @keyframes splash-anim {
      0%,100% { transform: translateX(-50%) scale(1); opacity:0.7; }
      50% { transform: translateX(-50%) scale(1.3); opacity:1; }
    }

    /* ROCKS */
    .rocks {
      position: absolute;
      bottom: 200px;
      left: 60px;
      z-index: 5;
    }
    .rock {
      position: absolute;
      background: linear-gradient(145deg, #c8b88a 0%, #a09060 50%, #7a6840 100%);
      border-radius: 60% 40% 50% 55% / 50% 55% 45% 60%;
    }
    .rock-1 { width: 140px; height: 80px; bottom: 0; left: 0; }
    .rock-2 { width: 100px; height: 60px; bottom: 30px; left: 20px; }
    .rock-3 { width: 80px; height: 50px; bottom: 55px; left: 40px; border-radius: 50% 40% 60% 45% / 55% 50% 45% 60%; }

    /* FIGURES */
    .figures {
      position: absolute;
      bottom: 240px;
      left: 80px;
      z-index: 20;
      animation: jump 1.8s infinite ease-in-out;
    }
    @keyframes jump {
      0%   { transform: translateY(0) rotate(0deg); }
      30%  { transform: translateY(-40px) rotate(-5deg); }
      60%  { transform: translateY(-60px) rotate(8deg); }
      80%  { transform: translateY(-30px) rotate(3deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    /* ---- FIGURE: MAMMA ---- */
    .mamma {
      position: absolute;
      left: 0;
      bottom: 0;
    }
    /* mamma body */
    .mamma-body {
      width: 44px; height: 70px;
      background: #1a3a6b;
      border-radius: 12px 12px 8px 8px;
      position: absolute;
      bottom: 0; left: 0;
    }
    /* mamma stripe */
    .mamma-body::after {
      content: '';
      position: absolute;
      bottom: 14px; left: 0; right: 0;
      height: 10px;
      background: repeating-linear-gradient(90deg, #fff 0px, #fff 4px, #1a3a6b 4px, #1a3a6b 8px);
      border-radius: 0 0 4px 4px;
    }
    /* mamma pants */
    .mamma-pants {
      width: 44px; height: 36px;
      background: #1c1c1c;
      border-radius: 4px 4px 10px 10px;
      position: absolute;
      bottom: 36px; left: 0;
    }
    /* mamma head */
    .mamma-head {
      width: 36px; height: 36px;
      background: #F5C6A0;
      border-radius: 50%;
      position: absolute;
      bottom: 100px; left: 4px;
      border: 2px solid #e8b090;
    }
    /* mamma hair */
    .mamma-head::before {
      content: '';
      position: absolute;
      top: -6px; left: -2px; right: -2px;
      height: 20px;
      background: #e8e8e8;
      border-radius: 50% 50% 0 0;
    }
    /* mamma sunglasses */
    .mamma-glasses {
      position: absolute;
      bottom: 117px; left: 7px;
      font-size: 14px;
    }
    /* mamma arms up */
    .mamma-arm-l {
      width: 8px; height: 30px;
      background: #1a3a6b;
      border-radius: 4px;
      position: absolute;
      bottom: 68px; left: -10px;
      transform: rotate(-40deg);
      transform-origin: bottom center;
    }
    .mamma-arm-r {
      width: 8px; height: 30px;
      background: #1a3a6b;
      border-radius: 4px;
      position: absolute;
      bottom: 68px; left: 46px;
      transform: rotate(40deg);
      transform-origin: bottom center;
      animation: wave-arm 0.8s infinite alternate ease-in-out;
    }
    @keyframes wave-arm {
      from { transform: rotate(40deg); }
      to { transform: rotate(70deg); }
    }
    /* mamma legs */
    .mamma-leg-l {
      width: 14px; height: 32px;
      background: #1c1c1c;
      border-radius: 0 0 6px 6px;
      position: absolute;
      bottom: -26px; left: 4px;
      transform: rotate(-15deg);
    }
    .mamma-leg-r {
      width: 14px; height: 32px;
      background: #1c1c1c;
      border-radius: 0 0 6px 6px;
      position: absolute;
      bottom: -26px; left: 24px;
      transform: rotate(15deg);
    }

    /* ---- FIGURE: FIGLIO ---- */
    .figlio {
      position: absolute;
      left: 55px;
      bottom: 0;
    }
    /* figlio body */
    .figlio-body {
      width: 52px; height: 80px;
      background: #1a3a6b;
      border-radius: 14px 14px 8px 8px;
      position: absolute;
      bottom: 0; left: 0;
    }
    /* smiley face on shirt */
    .figlio-smiley {
      position: absolute;
      bottom: 30px; left: 8px;
      width: 36px; height: 36px;
      background: #FFE000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 1;
    }
    /* figlio pants */
    .figlio-pants {
      width: 52px; height: 44px;
      background: #b0bec5;
      border-radius: 4px 4px 10px 10px;
      position: absolute;
      bottom: 36px; left: 0;
    }
    /* figlio head */
    .figlio-head {
      width: 44px; height: 44px;
      background: #F5C6A0;
      border-radius: 50%;
      position: absolute;
      bottom: 110px; left: 4px;
      border: 2px solid #e8b090;
    }
    /* figlio curly hair */
    .figlio-head::before {
      content: '';
      position: absolute;
      top: -10px; left: -4px; right: -4px;
      height: 24px;
      background: #3d2005;
      border-radius: 60% 60% 20% 20%;
      box-shadow: -8px 4px 0 -2px #3d2005, 8px 4px 0 -2px #3d2005,
                  -12px 0px 0 0px #3d2005, 12px 0px 0 0px #3d2005;
    }
    /* figlio smile */
    .figlio-head::after {
      content: '😄';
      position: absolute;
      top: 12px; left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
    }
    /* figlio arms up */
    .figlio-arm-l {
      width: 10px; height: 38px;
      background: #1a3a6b;
      border-radius: 5px;
      position: absolute;
      bottom: 76px; left: -12px;
      transform: rotate(-50deg);
      transform-origin: bottom center;
      animation: wave-arm2 0.8s infinite alternate ease-in-out;
    }
    @keyframes wave-arm2 {
      from { transform: rotate(-50deg); }
      to { transform: rotate(-80deg); }
    }
    .figlio-arm-r {
      width: 10px; height: 38px;
      background: #1a3a6b;
      border-radius: 5px;
      position: absolute;
      bottom: 76px; left: 54px;
      transform: rotate(50deg);
      transform-origin: bottom center;
    }
    /* figlio legs */
    .figlio-leg-l {
      width: 16px; height: 38px;
      background: #b0bec5;
      border-radius: 0 0 6px 6px;
      position: absolute;
      bottom: -30px; left: 6px;
      transform: rotate(-20deg);
    }
    .figlio-leg-r {
      width: 16px; height: 38px;
      background: #b0bec5;
      border-radius: 0 0 6px 6px;
      position: absolute;
      bottom: -30px; left: 28px;
      transform: rotate(20deg);
    }

    /* BUBBLES */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      animation: rise 4s infinite ease-in;
    }
    @keyframes rise {
      0%   { transform: translateY(0) scale(0.8); opacity:0.7; }
      100% { transform: translateY(-200px) scale(1.2); opacity:0; }
    }

    /* CONFETTI */
    .confetto {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 2px;
      animation: fall 3s infinite linear;
    }
    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity:1; }
      100% { transform: translateY(620px) rotate(720deg); opacity:0.3; }
    }

    /* TEXT AREA */
    .text-area {
      position: absolute;
      bottom: 28px;
      left: 0; right: 0;
      text-align: center;
      z-index: 30;
    }
    .main-text {
      font-family: 'Fredoka One', 'Arial Rounded MT Bold', Impact, sans-serif;
      font-size: 52px;
      color: #fff;
      text-shadow:
        3px 3px 0 #0a5880,
        -2px -2px 0 #0a5880,
        2px -2px 0 #0a5880,
        -2px 2px 0 #0a5880,
        0 4px 12px rgba(0,0,0,0.4);
      letter-spacing: 1px;
      animation: bounce-text 2s infinite ease-in-out;
      line-height: 1.1;
    }
    @keyframes bounce-text {
      0%,100% { transform: scale(1) rotate(-1deg); }
      50% { transform: scale(1.04) rotate(1deg); }
    }
    .sub-text {
      font-family: 'Nunito', 'Arial Rounded MT Bold', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: #FFE566;
      text-shadow: 2px 2px 0 #0a5880, 0 2px 8px rgba(0,0,0,0.3);
      margin-top: 4px;
    }

    /* Top banner */
    .top-banner {
      position: absolute;
      top: 18px; left: 0; right: 0;
      text-align: center;
      z-index: 30;
    }
    .birthday-text {
      font-family: 'Fredoka One', sans-serif;
      font-size: 26px;
      color: #FFE566;
      text-shadow: 2px 2px 0 #0a5880;
      background: rgba(0,0,0,0.18);
      display: inline-block;
      padding: 6px 22px;
      border-radius: 30px;
    }

    /* Water splashes around feet */
    .splash-drops {
      position: absolute;
      z-index: 15;
    }
  </style>
</head>
<body>
<div class="card">

  <!-- SKY -->
  <div class="sky"></div>
  <div class="sun"></div>

  <!-- Top banner -->
  <div class="top-banner">
    <span class="birthday-text">🎂 Compleanno al Mare! 🌊</span>
  </div>

  <!-- Confetti -->
  <div class="confetto" style="left:5%;  top:0; background:#FF6B6B; animation-delay:0s;   animation-duration:2.8s;"></div>
  <div class="confetto" style="left:12%; top:0; background:#FFE566; animation-delay:0.4s; animation-duration:3.2s; border-radius:50%;"></div>
  <div class="confetto" style="left:22%; top:0; background:#6BCB77; animation-delay:0.7s; animation-duration:2.5s;"></div>
  <div class="confetto" style="left:35%; top:0; background:#4D96FF; animation-delay:1.1s; animation-duration:3.5s; border-radius:50%;"></div>
  <div class="confetto" style="left:50%; top:0; background:#FF6B6B; animation-delay:0.2s; animation-duration:2.9s;"></div>
  <div class="confetto" style="left:62%; top:0; background:#FFE566; animation-delay:0.9s; animation-duration:3.1s;"></div>
  <div class="confetto" style="left:73%; top:0; background:#6BCB77; animation-delay:0.5s; animation-duration:2.7s; border-radius:50%;"></div>
  <div class="confetto" style="left:83%; top:0; background:#FF9A3C; animation-delay:1.3s; animation-duration:3.3s;"></div>
  <div class="confetto" style="left:92%; top:0; background:#4D96FF; animation-delay:0.6s; animation-duration:2.6s;"></div>
  <div class="confetto" style="left:18%; top:0; background:#FF9A3C; animation-delay:1.8s; animation-duration:3.0s; width:6px; height:14px;"></div>
  <div class="confetto" style="left:45%; top:0; background:#FF6B6B; animation-delay:2.1s; animation-duration:2.4s; width:8px; height:8px; border-radius:50%;"></div>
  <div class="confetto" style="left:70%; top:0; background:#FFE566; animation-delay:1.6s; animation-duration:3.4s; width:12px; height:6px;"></div>

  <!-- SEA -->
  <div class="sea">
    <div class="wave1"></div>
    <div class="wave2"></div>
  </div>

  <!-- Bubbles in sea -->
  <div class="bubble" style="width:12px;height:12px; left:45%; bottom:80px; animation-delay:0s;"></div>
  <div class="bubble" style="width:8px; height:8px;  left:50%; bottom:60px; animation-delay:1s;"></div>
  <div class="bubble" style="width:16px;height:16px; left:55%; bottom:100px;animation-delay:2s;"></div>
  <div class="bubble" style="width:10px;height:10px; left:40%; bottom:70px; animation-delay:0.5s;"></div>

  <!-- Splash emoji -->
  <div class="splash" style="bottom:215px; left:44%;">💦</div>
  <div class="splash" style="bottom:230px; left:55%; animation-delay:0.4s; font-size:22px;">💦</div>

  <!-- Rocks -->
  <div class="rocks">
    <div class="rock rock-1"></div>
    <div class="rock rock-2"></div>
    <div class="rock rock-3"></div>
  </div>

  <!-- Jumping figures -->
  <div class="figures" style="left:60px; bottom:240px;">

    <!-- MAMMA -->
    <div class="mamma">
      <div class="mamma-head">
        <span style="position:absolute;top:10px;left:3px;font-size:13px;">🕶️</span>
      </div>
      <div class="mamma-arm-l"></div>
      <div class="mamma-arm-r"></div>
      <div class="mamma-pants"></div>
      <div class="mamma-body"></div>
      <div class="mamma-leg-l"></div>
      <div class="mamma-leg-r"></div>
    </div>

    <!-- FIGLIO -->
    <div class="figlio">
      <div class="figlio-head"></div>
      <div class="figlio-arm-l"></div>
      <div class="figlio-arm-r"></div>
      <div class="figlio-pants"></div>
      <div class="figlio-body">
        <div class="figlio-smiley">😊</div>
      </div>
      <div class="figlio-leg-l"></div>
      <div class="figlio-leg-r"></div>
    </div>

  </div>

  <!-- Decorative fish -->
  <div style="position:absolute; bottom:140px; right:80px; font-size:34px; animation: fish-swim 3s infinite ease-in-out; z-index:8;">🐟</div>
  <div style="position:absolute; bottom:100px; left:60%; font-size:22px; animation: fish-swim 4s infinite ease-in-out reverse; z-index:8;">🐠</div>
  <style>
    @keyframes fish-swim {
      0%,100% { transform: translateX(0) scaleX(1); }
      50% { transform: translateX(20px) scaleX(-1); }
    }
  </style>

  <!-- Seagull -->
  <div style="position:absolute; top:60px; left:120px; font-size:28px; animation: fly 4s infinite ease-in-out; z-index:6;">🦅</div>
  <style>
    @keyframes fly { 0%,100%{transform:translateY(0) translateX(0);} 50%{transform:translateY(-12px) translateX(20px);} }
  </style>

  <!-- TEXT -->
  <div class="text-area">
    <div class="main-text">🙏 Grazie a tutti<br>per gli auguri! 🎉</div>
    <div class="sub-text">— Io e la mia mamma, pronti al tuffo! 🤿 —</div>
  </div>

</div>
</body>
</html>
