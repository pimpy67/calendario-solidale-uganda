# Aggiorna il sito sul VPS a ogni unione su main (e a mano da "Run workflow").
# Segreti richiesti (Settings → Secrets and variables → Actions), vedi DEPLOY.md:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_APP_DIR
# Facoltativi: VPS_PORT (default 22), VPS_KNOWN_HOSTS, VPS_RESTART_CMD (default "docker compose up -d --build")
name: Deploy sul VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un deploy alla volta; se ne arriva uno nuovo mentre l'altro gira, il nuovo aspetta
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Controlla che i segreti ci siano
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          missing=""
          for v in VPS_HOST VPS_USER VPS_SSH_KEY VPS_APP_DIR; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Mancano i segreti:$missing (vedi DEPLOY.md)"
            exit 1
          fi

      - name: Scarica gli script del workflow
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Prepara la chiave SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Ogni problema diventa un'annotazione leggibile nel riepilogo del run (mai il contenuto della chiave)
          # Ricostruisce la chiave anche se incollata male (a capo persi, spazi, \r) o in base64
          if ! python3 .github/scripts/normalizza-chiave.py ~/.ssh/deploy_key 2> /tmp/norm.err; then
            echo "::error::Lettura di VPS_SSH_KEY fallita: $(tail -n 1 /tmp/norm.err)"
            exit 1
          fi
          # Impronta (pubblica, non segreta) da confrontare con quella sul VPS
          if ! FP=$(ssh-keygen -lf ~/.ssh/deploy_key 2>&1); then
            echo "::error::VPS_SSH_KEY non è una chiave privata valida ($FP). Ricopiala intera o usa la versione base64"
            exit 1
          fi
          echo "::notice::Impronta della chiave usata: $FP"
          # Più sicuro: impronta del server salvata nel segreto VPS_KNOWN_HOSTS (vedi DEPLOY.md).
          # Se manca, la si legge dal server a ogni deploy.
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          elif ! ssh-keyscan -T 15 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2> /tmp/keyscan.err \
               || [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Il server $VPS_HOST:$VPS_PORT non risponde a SSH da GitHub: $(tail -n 1 /tmp/keyscan.err). Controlla VPS_HOST, la porta e il firewall del VPS"
            exit 1
          fi

      - name: Aggiorna il codice e riavvia
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_RESTART_CMD: ${{ secrets.VPS_RESTART_CMD || 'docker compose up -d --build' }}
        run: |
          # ssh unisce gli argomenti in una sola riga: printf %q li protegge (percorsi o comandi con spazi)
          set +e
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=20 -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "bash -s -- $(printf '%q ' "$VPS_APP_DIR" "$VPS_RESTART_CMD")" 2> >(tee /tmp/ssh.err >&2) <<'REMOTE'
          set -euo pipefail
          cd "$1"
          echo "Versione prima: $(git rev-parse --short HEAD)"
          # Solo avanzamento lineare: se sul VPS ci sono modifiche locali o un altro ramo, si ferma senza toccare niente
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          echo "Versione dopo:  $(git rev-parse --short HEAD)"
          echo "Riavvio: $2"
          bash -c "$2"
          if [[ "$2" == docker* ]]; then docker image prune -f >/dev/null || true; fi
          # Aspetta che il server risponda (fino a 60 secondi)
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/stats >/dev/null; then
              echo "Il sito risponde."
              exit 0
            fi
            sleep 2
          done
          echo "Il sito non risponde dopo il riavvio:"
          if [[ "$2" == docker* ]]; then docker compose logs --tail=50 app || true; fi
          exit 1
          REMOTE
          rc=$?
          if [ $rc -eq 255 ]; then
            echo "::error::Collegamento SSH rifiutato: $(grep -v '^Warning' /tmp/ssh.err | tail -n 1). Controlla che la chiave pubblica sia in authorized_keys sul VPS"
          elif [ $rc -ne 0 ]; then
            echo "::error::Aggiornamento sul VPS fallito (codice $rc): $(tail -n 1 /tmp/ssh.err)"
          fi
          exit $rc

      - name: Pulisci la chiave
        if: always()
        run: rm -f ~/.ssh/deploy_key
